<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Waterworks dashboard</title>
    <style>
      :root { color-scheme: light dark; --line: #8884; --accent: #2f7de1; font: 15px system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; display: grid; grid-template-rows: auto 1fr; height: 100vh; }
      header { display: flex; gap: 1rem; align-items: center; padding: 0.75rem 1rem; border-bottom: 1px solid var(--line); }
      header h1 { flex: 1; margin: 0; font-size: 1.2rem; }
      #status { font-size: 0.85rem; opacity: 0.75; }
      button { padding: 0.4rem 0.9rem; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: inherit; cursor: pointer; }
      button.primary, button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: white; }
      button:disabled { opacity: 0.4; cursor: default; }
      .layout { display: grid; grid-template-columns: 1fr 20rem; min-height: 0; }
      main { overflow: auto; padding: 1rem; }
      #board { position: relative; }
      #page { display: block; width: 100%; min-height: 400px; border: 0; border-radius: 8px; background: white; }
      #version { font-size: 0.8rem; padding: 0.1rem 0.5rem; border: 1px solid var(--line); border-radius: 999px; }
      #version:empty { display: none; }
      #panels { display: grid; grid-template-columns: repeat(auto-fill, minmax(18rem, 1fr)); gap: 1rem; }
      .panel { border: 1px solid var(--line); border-radius: 8px; padding: 0.75rem 1rem; min-height: 6rem; overflow: hidden; }
      .panel h2 { margin: 0 0 0.5rem; font-size: 0.85rem; font-weight: 600; opacity: 0.8; }
      .stat .value { font-size: 2.2rem; font-weight: 650; }
      .stat .delta { font-size: 0.85rem; opacity: 0.75; }
      .text p { white-space: pre-wrap; margin: 0; }
      svg { width: 100%; height: 9rem; display: block; }
      .legend { display: flex; gap: 0.75rem; flex-wrap: wrap; font-size: 0.8rem; }
      .legend span::before { content: ""; display: inline-block; width: 0.7rem; height: 0.7rem; margin-right: 0.3rem; border-radius: 2px; background: var(--c); }
      .range { font-size: 0.75rem; opacity: 0.65; }
      .bar { display: grid; grid-template-columns: 6rem 1fr 4rem; gap: 0.5rem; align-items: center; font-size: 0.85rem; margin: 0.2rem 0; }
      .bar div { height: 0.8rem; background: var(--accent); border-radius: 3px; }
      table { border-collapse: collapse; width: 100%; font-size: 0.85rem; }
      th, td { text-align: left; padding: 0.25rem 0.4rem; border-bottom: 1px solid var(--line); }
      #overlay { position: absolute; inset: 0; cursor: crosshair; display: none; background: #2f7de10d; outline: 2px dashed var(--accent); }
      #overlay.active { display: block; }
      .region { position: absolute; border: 2px solid var(--accent); border-radius: 3px; pointer-events: none; }
      .region b { position: absolute; top: -0.7rem; left: -0.7rem; background: var(--accent); color: white; border-radius: 999px; padding: 0 0.4rem; font-size: 0.75rem; }
      /* The selection being commented on: solid. Once sent, the same box stays, hatched. */
      .region.draft { background: #2f7de12e; box-shadow: 0 0 0 3px #2f7de140; }
      .region.placed { background: repeating-linear-gradient(135deg, #2f7de138 0 6px, transparent 6px 12px); }
      .region.hover { border-style: dashed; background: #2f7de114; }
      .region.highlight { background: #2f7de155; }
      .comment.cleared { opacity: 0.55; }
      aside { border-left: 1px solid var(--line); overflow: auto; padding: 1rem; }
      aside h2 { font-size: 0.95rem; margin: 0 0 0.75rem; }
      .comment { border: 1px solid var(--line); border-radius: 6px; padding: 0.5rem 0.7rem; margin-bottom: 0.6rem; font-size: 0.85rem; }
      .comment .meta { opacity: 0.65; font-size: 0.75rem; }
      .reply { margin-top: 0.4rem; padding-left: 0.6rem; border-left: 3px solid var(--accent); }
      #composer { position: fixed; right: 1.5rem; bottom: 1.5rem; width: 22rem; padding: 1rem; border: 1px solid var(--line); border-radius: 8px; background: Canvas; box-shadow: 0 8px 30px #0004; display: none; }
      #composer.open { display: block; }
      #composer textarea { width: 100%; min-height: 5rem; font: inherit; }
      #composer .meta { font-size: 0.8rem; opacity: 0.75; margin: 0.25rem 0 0.5rem; }
      #composer .actions { display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 0.5rem; }
      #setup { max-width: 40rem; }
    </style>
  </head>
  <body>
    <header>
      <h1 id="title">Waterworks dashboard</h1>
      <span id="version"></span>
      <span id="status" role="status">offline</span>
      <button id="comment" aria-pressed="false" disabled title="Drag a rectangle, or select text first">Comment area</button>
      <button id="pick" aria-pressed="false" disabled title="Hover and click an element">Select element</button>
    </header>
    <div class="layout">
      <main>
        <div id="setup" hidden>
          <p>Open this page with a dashboard endpoint, for example:</p>
          <pre>ww dashboard --title "My dashboard"</pre>
          <p>The printed URL carries the endpoint's credentials in the fragment, which never reaches the server.</p>
        </div>
        <div id="board">
          <div id="panels"></div>
          <div id="markers"></div>
          <div id="overlay" aria-label="Drag to select an area, or press Enter for the whole dashboard" tabindex="-1"></div>
        </div>
      </main>
      <aside>
        <h2>Comments</h2>
        <div id="comments"></div>
      </aside>
    </div>
    <div id="composer" role="dialog" aria-labelledby="composer-title">
      <strong id="composer-title">Comment to agent</strong>
      <div class="meta" id="composer-meta"></div>
      <label for="composer-text" hidden>Comment</label>
      <textarea id="composer-text" placeholder="What should change here?"></textarea>
      <div class="actions">
        <button id="composer-cancel">Cancel</button>
        <button id="composer-send" class="primary">Send</button>
      </div>
    </div>
    <script type="module" src="/dashboard/app.js"></script>
  </body>
</html>

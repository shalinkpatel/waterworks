<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Waterworks echo</title>
    <style>
      body { max-width: 48rem; margin: 3rem auto; padding: 0 1rem; font: 16px system-ui; }
      label { display: block; margin: 0.75rem 0; }
      input { box-sizing: border-box; width: 100%; padding: 0.5rem; }
      button { padding: 0.5rem 1rem; margin-right: 0.5rem; }
      #log { padding: 1rem; background: #111; color: #eee; white-space: pre-wrap; }
      #status { font-weight: 600; }
    </style>
  </head>
  <body>
    <h1>Waterworks echo</h1>
    <p>Register browser and CLI endpoints, enter their credentials, then run <code>ww echo</code> as the CLI endpoint.</p>
    <label>Browser endpoint ID <input id="endpoint" autocomplete="off" /></label>
    <label>Browser endpoint token <input id="token" type="password" autocomplete="off" /></label>
    <label>CLI endpoint ID <input id="target" autocomplete="off" /></label>
    <button id="connect">Connect</button>
    <span id="status">offline</span>
    <hr />
    <label>Message <input id="text" value="hello waterworks" /></label>
    <button id="send" disabled>Send to CLI</button>
    <h2>Events</h2>
    <div id="log"></div>
    <script src="/demo/app.js"></script>
  </body>
</html>

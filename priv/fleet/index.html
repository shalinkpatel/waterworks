<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Waterworks fleet</title>
<link rel="icon" type="image/svg+xml" href="/fleet/icon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Baseten design system tokens (basevibe colors_and_type.css), mapped to light and dark themes. */
  :root {
    --bg: #f1f7ef; --surface: #fff; --border: #dee4de; --text: #00120b; --muted: #5a675e; --faint: #869089;
    --subtle: #f4f9f3; --header: #0c1d13; --accent: #0e863f; --live: #19e76e; --on: #0c1d13; --on-text: #fff;
    --online-bg: #e5fcef; --online: #0e863f; --agent-bg: #f0f6ff; --agent: #1960d3; --tool-bg: #fff0fe; --tool: #a2329e;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #021309; --surface: #0c1d13; --border: #203026; --text: #f4f9f3; --muted: #9ca59e; --faint: #707c73;
    --subtle: #102419; --header: #000; --accent: #4cec8e; --on: #19e76e; --on-text: #00120b;
    --online-bg: #00331e; --online: #4cec8e; --agent-bg: #001d4d; --agent: #74a9ff; --tool-bg: #3a1039; --tool: #ffa9fd;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font: 14px/1.45 Inter, system-ui, sans-serif; color: var(--text); background: var(--bg); transition: background .2s, color .2s; }
  header { background: var(--header); color: #fff; padding: 22px 28px; display: flex; align-items: baseline; gap: 14px; border-bottom: 1px solid var(--border); }
  header h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
  header .logo { display: flex; align-self: center; }
  header .logo svg { border-radius: 8px; box-shadow: 0 0 0 1px #344339, 0 0 14px rgba(25, 231, 110, .25); }
  header .sub { font: 12px "IBM Plex Mono", monospace; color: #869089; text-transform: uppercase; letter-spacing: 0.08em; }
  #theme { margin-left: auto; align-self: center; border: 1px solid #344339; background: transparent; color: #fff; border-radius: 999px;
           padding: 5px 12px; font: 500 12px Inter, sans-serif; cursor: pointer; }
  #theme:hover { border-color: var(--live); }
  main { padding: 24px 28px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 22px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; border-top: 4px solid var(--c); }
  .stat .label { font: 11px "IBM Plex Mono", monospace; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
  .stat .value { font-size: 34px; font-weight: 700; margin-top: 4px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .toolbar { display: flex; gap: 18px; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .toolbar h2 { margin: 0 auto 0 0; font-size: 15px; }
  .tabs { display: flex; gap: 4px; margin-right: auto; }
  .tab { border: 0; background: transparent; color: var(--muted); font: 600 15px Inter, sans-serif; padding: 6px 12px;
         border-radius: 8px; cursor: pointer; }
  .tab[aria-selected="true"] { color: var(--text); background: var(--subtle); }
  .tab .count { font: 500 11px "IBM Plex Mono", monospace; color: var(--faint); margin-left: 4px; }
  .bc { padding: 14px 18px; border-top: 1px solid var(--border); cursor: pointer; }
  .bc:first-child { border-top: 0; }
  .bc:hover { background: var(--subtle); }
  .bc .meta { display: flex; justify-content: space-between; font: 12px "IBM Plex Mono", monospace; color: var(--muted); margin-bottom: 6px; }
  .bc .text { white-space: pre-wrap; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 8px; }
  .bc .who { display: flex; gap: 6px; flex-wrap: wrap; }
  .group { display: flex; gap: 6px; align-items: center; }
  .group > span { font: 11px "IBM Plex Mono", monospace; text-transform: uppercase; color: var(--muted); margin-right: 2px; }
  .chip { border: 1px solid var(--border); background: var(--subtle); border-radius: 999px; padding: 4px 11px; font: 500 12px Inter, sans-serif; cursor: pointer; color: var(--text); }
  .chip[aria-pressed="true"] { background: var(--on); border-color: var(--on); color: var(--on-text); }
  .toolbar input { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 8px; padding: 6px 10px; font: 13px Inter, sans-serif; width: 200px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font: 11px "IBM Plex Mono", monospace; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted);
       background: var(--subtle); padding: 10px 18px; cursor: pointer; user-select: none; white-space: nowrap; }
  th[aria-sort="ascending"]::after { content: " ▲"; color: var(--accent); }
  th[aria-sort="descending"]::after { content: " ▼"; color: var(--accent); }
  td { padding: 10px 18px; border-top: 1px solid var(--border); }
  tr:hover td { background: var(--subtle); }
  .remove { border: 1px solid var(--border); background: transparent; color: var(--muted); border-radius: 8px; padding: 3px 10px;
            font: 500 12px Inter, sans-serif; cursor: pointer; }
  .remove:hover, .remove.armed { border-color: #dd403a; color: #dd403a; }
  .remove:disabled { opacity: .5; cursor: default; }
  td.actions { white-space: nowrap; }
  td.pick, th.pick { width: 36px; padding-right: 0; }
  td.pick input, th.pick input { accent-color: var(--accent); width: 16px; height: 16px; cursor: pointer; }
  .recipients { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .recipients .chip { cursor: default; }
  #compose textarea { width: 100%; min-height: 120px; resize: vertical; border: 1px solid var(--border); border-radius: 10px;
                      background: var(--bg); color: var(--text); padding: 10px 12px; font: 14px/1.45 Inter, sans-serif; }
  #compose textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  dialog .footer .hint { margin-right: auto; font: 11px "IBM Plex Mono", monospace; color: var(--faint); align-self: center; }
  .primary { border: 0; border-radius: 8px; padding: 9px 16px; background: var(--on); color: var(--on-text);
             font: 600 13px Inter, sans-serif; cursor: pointer; }
  .primary:disabled { opacity: .5; cursor: default; }
  .ghost { border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; background: transparent; color: var(--text);
           font: 500 13px Inter, sans-serif; cursor: pointer; }
  dialog { border: 1px solid var(--border); border-radius: 14px; padding: 0; width: min(560px, 92vw); background: var(--surface);
           color: var(--text); box-shadow: 0 24px 60px rgba(0,0,0,.45); }
  dialog::backdrop { background: rgba(0, 18, 11, .55); }
  dialog header { background: var(--header); padding: 16px 20px; }
  dialog h3 { margin: 0; font-size: 16px; color: #fff; }
  dialog .body { padding: 16px 20px; }
  dialog blockquote { margin: 0 0 14px; padding: 10px 12px; border-left: 3px solid var(--accent); background: var(--subtle);
                      border-radius: 0 8px 8px 0; white-space: pre-wrap; max-height: 140px; overflow: auto; }
  dialog .tally { font: 12px "IBM Plex Mono", monospace; color: var(--muted); margin-bottom: 8px; }
  dialog ul { list-style: none; margin: 0; padding: 0; max-height: 300px; overflow: auto; }
  dialog li { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-top: 1px solid var(--border); }
  dialog .footer { display: flex; justify-content: flex-end; gap: 8px; padding: 0 20px 16px; }
  .pending { background: var(--subtle); color: var(--muted); }
  .acked { background: var(--online-bg); color: var(--online); }
  .failed { background: #fcefee; color: #b4332e; }
  td.actions .remove + .remove { margin-left: 6px; }
  td.mono { font: 12px "IBM Plex Mono", monospace; color: var(--muted); }
  .badge { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 600; }
  .online { background: var(--online-bg); color: var(--online); }
  .online::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--live); }
  .offline { background: var(--subtle); color: var(--faint); }
  .agent { background: var(--agent-bg); color: var(--agent); }
  .tool { background: var(--tool-bg); color: var(--tool); }
  .empty { padding: 24px; text-align: center; color: var(--faint); }
</style>
</head>
<body>
<header><span class="logo" aria-hidden="true"><svg width="30" height="30" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#0c1d13"/><path d="M32 9C32 9 15 29 15 40a17 17 0 0 0 34 0C49 29 32 9 32 9Z" fill="#19e76e"/><path d="M25 43 32 31 39 43Z" fill="none" stroke="#0c1d13" stroke-width="2.2" stroke-linejoin="round"/><g fill="#0c1d13"><circle cx="32" cy="31" r="3.6"/><circle cx="25" cy="43" r="3.6"/><circle cx="39" cy="43" r="3.6"/></g></svg></span><h1>Waterworks fleet</h1><span class="sub" id="updated"></span><button id="theme" type="button"></button></header>
<main>
  <section class="stats" id="stats"></section>
  <section class="card">
    <div class="toolbar">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="tab-endpoints" aria-selected="true" type="button">Endpoints</button>
        <button class="tab" role="tab" id="tab-broadcasts" aria-selected="false" type="button">Broadcasts</button>
      </div>
      <div class="group ep-only" data-filter="kind"><span>Kind</span></div>
      <div class="group ep-only" data-filter="type"><span>Type</span></div>
      <div class="group ep-only" data-filter="status"><span>Status</span></div>
      <input id="q" class="ep-only" type="search" placeholder="Search name, id" aria-label="Search endpoints">
      <button id="broadcast-open" class="primary" type="button" hidden></button>
      <button id="remove-offline" class="remove" type="button" hidden></button>
    </div>
    <table id="endpoints-table" role="tabpanel" aria-labelledby="tab-endpoints">
      <thead><tr id="head"></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="broadcasts" role="tabpanel" aria-labelledby="tab-broadcasts" hidden></div>
  </section>
</main>
<dialog id="compose" aria-labelledby="compose-title">
  <header><h3 id="compose-title">Broadcast</h3></header>
  <div class="body">
    <div class="recipients" id="recipients"></div>
    <textarea id="broadcast-text" placeholder="Message to the selected sessions" aria-label="Broadcast message"></textarea>
  </div>
  <div class="footer">
    <span class="hint">⌘↵ to send</span>
    <button id="broadcast-clear" class="ghost" type="button">Clear selection</button>
    <button id="broadcast-cancel" class="ghost" type="button">Cancel</button>
    <button id="broadcast-send" class="primary" type="button">Send</button>
  </div>
</dialog>
<dialog id="receipts" aria-labelledby="receipts-title">
  <header><h3 id="receipts-title">Broadcast</h3></header>
  <div class="body">
    <blockquote id="receipts-text"></blockquote>
    <div class="tally" id="receipts-tally"></div>
    <ul id="receipts-list"></ul>
  </div>
  <div class="footer"><button class="ghost" type="button" id="receipts-close">Close</button></div>
</dialog>
<script src="/fleet/app.js"></script>
</body>
</html>
